<!doctype html>
<html><head><meta charset="utf-8"><title>Laboratorio m3 (sesión 5, opus-a)</title></head>
<body>
<canvas id="c" width="64" height="64"></canvas>
<script>
// Laboratorio de afirmaciones del módulo 3 (sesión 5, opus-a). Lo abre s5-opus-a-m3-lab.mjs.
// window.prueba({fs, w, h, uniforms, u8}) → {ok, log, pix}  (pix: Float32Array RGBA o Uint8Array)
const c = document.getElementById("c");
const gl = c.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: true });
window.__gl = gl;
const extCBF = gl.getExtension("EXT_color_buffer_float");
const VS = "#version 300 es\nin vec2 a_pos;\nvoid main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }\n";
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
let contador = 0;
function compilar(tipo, src) {
  const s = gl.createShader(tipo); gl.shaderSource(s, src); gl.compileShader(s);
  return { s, ok: gl.getShaderParameter(s, gl.COMPILE_STATUS), log: gl.getShaderInfoLog(s) || "" };
}
window.compilarSolo = (fs) => { const r = compilar(gl.FRAGMENT_SHADER, fs); return { ok: r.ok, log: r.log }; };
window.prueba = ({ fs, w = 1, h = 1, uniforms = {}, u8 = false, sinCache = true }) => {
  let src = fs;
  if (sinCache) src = src.replace(/\n/, "\n// lab " + (++contador) + "-" + Math.random() + "\n");
  const v = compilar(gl.VERTEX_SHADER, VS), f = compilar(gl.FRAGMENT_SHADER, src);
  if (!f.ok) return { ok: false, log: f.log };
  const p = gl.createProgram(); gl.attachShader(p, v.s); gl.attachShader(p, f.s);
  gl.bindAttribLocation(p, 0, "a_pos"); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return { ok: false, log: gl.getProgramInfoLog(p) };
  gl.useProgram(p);
  for (const [n, val] of Object.entries(uniforms)) {
    const loc = gl.getUniformLocation(p, n); if (!loc) continue;
    if (typeof val === "object" && val.int !== undefined) { const a = [].concat(val.int); gl["uniform" + a.length + "iv"](loc, a); }
    else if (typeof val === "object" && val.uint !== undefined) { const a = [].concat(val.uint); gl["uniform" + a.length + "uiv"](loc, a); }
    else { const a = [].concat(val); gl["uniform" + a.length + "fv"](loc, new Float32Array(a)); }
  }
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, u8 ? gl.RGBA8 : gl.RGBA32F, w, h, 0, gl.RGBA, u8 ? gl.UNSIGNED_BYTE : gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.viewport(0, 0, w, h); gl.drawArrays(gl.TRIANGLES, 0, 3);
  const pix = u8 ? new Uint8Array(w * h * 4) : new Float32Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, u8 ? gl.UNSIGNED_BYTE : gl.FLOAT, pix);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb); gl.deleteTexture(t); gl.deleteProgram(p);
  return { ok: true, log: f.log, pix: Array.from(pix) };
};
window.listo = !!extCBF;
</script>
</body></html>
