<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111}body{height:6000px;position:relative}
canvas{display:block;pointer-events:none}
canvas.fijo{position:fixed;left:0;top:0;width:100vw;height:100vh}
canvas.abs{position:absolute;left:0;top:0;width:100%;height:6000px}
.tarjeta{position:absolute;left:100px;width:200px;height:120px;background:#00ff00}</style></head>
<body><canvas id="c"></canvas>
<script>
// Un rectángulo WebGL rojo debe cubrir la mitad derecha de cada tarjeta verde del DOM (columna x = 300..400 frente a 100..300).
// ?modo=fijo: canvas fixed, dibuja con el getBoundingClientRect() del rAF · ?modo=abs: canvas dentro del contenido.
const modo = new URLSearchParams(location.search).get('modo') || 'fijo';
const c = document.getElementById('c'); c.className = modo;
const tarjetas = [];
for (let i = 0; i < 25; i++) { const t = document.createElement('div'); t.className = 'tarjeta'; t.style.top = (300 + i * 230) + 'px'; document.body.appendChild(t); tarjetas.push(t); }
const gl = c.getContext('webgl2', { antialias: false });
gl.enable(gl.SCISSOR_TEST);
window.reg = [];
function frame(ms) {
  const rc = c.getBoundingClientRect();
  if (c.width !== Math.round(rc.width) || c.height !== Math.round(rc.height)) { c.width = Math.round(rc.width); c.height = Math.round(rc.height); }
  gl.viewport(0, 0, c.width, c.height);
  gl.scissor(0, 0, c.width, c.height); gl.clearColor(0.07, 0.07, 0.07, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.clearColor(1, 0, 0, 1);
  for (const t of tarjetas) {
    const r = t.getBoundingClientRect();
    const y = r.top - rc.top, x = r.right - rc.left;            // relativo al canvas, px CSS (DPR 1)
    if (y > c.height || y + r.height < 0) continue;
    gl.scissor(x, c.height - (y + r.height), 100, r.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
  window.reg.push([performance.now(), scrollY]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// En una captura (base64): para cada tarjeta visible, borde superior verde (x = 200) y rojo (x = 350)
window.medir = async (b64) => {
  const img = await createImageBitmap(await (await fetch('data:image/png;base64,' + b64)).blob());
  const oc = new OffscreenCanvas(img.width, img.height), cx = oc.getContext('2d');
  cx.drawImage(img, 0, 0);
  const col = (x) => { const d = cx.getImageData(x, 0, 1, img.height).data; const v = []; for (let y = 0; y < img.height; y++) v.push([d[4 * y], d[4 * y + 1], d[4 * y + 2]]); return v; };
  const verde = col(200), rojo = col(350);
  const bordes = (v, es) => { const b = []; for (let y = 1; y < v.length; y++) if (es(v[y]) && !es(v[y - 1])) b.push(y); return b; };
  const bv = bordes(verde, (p) => p[1] > 200 && p[0] < 60), br = bordes(rojo, (p) => p[0] > 200 && p[1] < 60);
  // empareja cada borde verde con el rojo más cercano
  const dif = bv.filter((y) => y > 5 && y < img.height - 5).map((y) => { let m = null; for (const r of br) if (m === null || Math.abs(r - y) < Math.abs(m - y)) m = r; return m === null ? null : y - m; });
  return dif.filter((x) => x !== null && Math.abs(x) < 200);
};
</script></body></html>
