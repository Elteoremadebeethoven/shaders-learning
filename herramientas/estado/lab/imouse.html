void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  vec2 uv = fragCoord / iResolution.xy;
  float d = length(fragCoord - iMouse.xy);
  vec3 c = texture(iChannel0, uv).rgb * 0.3 + vec3(step(d, 10.0));
  c.r += iChannelResolution[1].x / 1000.0 * 0.0 + iDate.w * 0.0 + iChannelTime[0] * 0.0 + iSampleRate * 0.0 + iFrameRate * 0.0;
  fragColor = vec4(c, 1.0);
}
