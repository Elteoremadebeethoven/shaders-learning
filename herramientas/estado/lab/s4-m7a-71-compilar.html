<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0}canvas{width:400px;height:300px;display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Compilación de un shader grande: preguntar LINK_STATUS enseguida (bloquea) frente a sondear COMPLETION_STATUS_KHR por frame.
const c = document.getElementById('c'); c.width = 400; c.height = 300;
const gl = c.getContext('webgl2');
const ext = gl.getExtension('KHR_parallel_shader_compile');
const VS = "#version 300 es\nvoid main(){ vec2 P[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3)); gl_Position=vec4(P[gl_VertexID],0,1);}";
// N funciones fbm distintas (constantes aleatorias: ni la caché de programas de Chrome ni la de Metal lo conocen)
window.fuente = (N) => {
  const r = () => (Math.random() * 10 + 0.5).toFixed(6);
  let s = "#version 300 es\nprecision highp float;\nuniform vec2 u_resolution;\nuniform float u_time;\nout vec4 o;\n" +
    "float h(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }\n" +
    "float n(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);\n  return mix(mix(h(i), h(i + vec2(1, 0)), u.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), u.x), u.y); }\n";
  for (let k = 0; k < N; k++) {
    s += `float f${k}(vec2 p) {\n  float s = 0.0, a = 0.5;\n  for (int i = 0; i < 6; i++) {\n    s += a * n(p + vec2(${r()}, ${r()}));\n` +
         `    p = mat2(0.8, 0.6, -0.6, 0.8) * p * ${(2 + Math.random() * 0.1).toFixed(6)};\n    a *= 0.5;\n  }\n  return s * ${r()};\n}\n`;
  }
  s += "void main() {\n  vec2 p = gl_FragCoord.xy / u_resolution.y;\n  float s = 0.0;\n";
  for (let k = 0; k < N; k++) s += `  s += f${k}(p * ${r()} + u_time);\n`;
  s += `  o = vec4(vec3(fract(s)), 1.0);\n}\n`;
  return s;
};
const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, VS); gl.compileShader(vs);
function lanzar(src) {
  const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, src); gl.compileShader(fs);
  const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  return p;
}
// bucle de fondo: registra los intervalos entre frames
const marcas = [];
const p0 = lanzar("#version 300 es\nprecision highp float;\nout vec4 o;\nvoid main(){ o = vec4(0.2, 0.3, 0.4, 1.0); }");
gl.getProgramParameter(p0, gl.LINK_STATUS);
gl.bindVertexArray(gl.createVertexArray());
let tareas = [];
function frame(ms) {
  marcas.push(performance.now());
  gl.useProgram(p0); gl.drawArrays(gl.TRIANGLES, 0, 3);
  const t = tareas; tareas = [];
  for (const f of t) f();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const enFrame = () => new Promise((res) => tareas.push(res));
const intervalos = (a, b) => { const v = []; for (let i = 1; i < marcas.length; i++) if (marcas[i] >= a && marcas[i] <= b) v.push(marcas[i] - marcas[i - 1]); return v; };
window.prueba = async (N) => {
  const r = { N, lineas: fuente(N).split('\n').length, parallel: !!ext };
  // A) preguntar enseguida
  await enFrame();
  let t0 = performance.now();
  const pa = lanzar(fuente(N));
  const t1 = performance.now();
  const okA = gl.getProgramParameter(pa, gl.LINK_STATUS);
  const t2 = performance.now();
  r.bloqueo = { lanzar: +(t1 - t0).toFixed(1), linkStatus: +(t2 - t1).toFixed(1), ok: okA };
  await new Promise((res) => setTimeout(res, 300));
  r.bloqueo.intervaloMax = +Math.max(...intervalos(t0, performance.now())).toFixed(1);
  // B) sondear COMPLETION_STATUS_KHR una vez por frame
  await new Promise((res) => setTimeout(res, 500));
  await enFrame();
  t0 = performance.now();
  const pb = lanzar(fuente(N));
  const tl = performance.now() - t0;
  let frames = 0, maxConsulta = 0, listo = false;
  while (!listo) {
    await enFrame(); frames++;
    const a = performance.now();
    listo = !ext || gl.getProgramParameter(pb, ext.COMPLETION_STATUS_KHR);
    maxConsulta = Math.max(maxConsulta, performance.now() - a);
    if (frames > 600) break;
  }
  const a = performance.now(); const okB = gl.getProgramParameter(pb, gl.LINK_STATUS); const linkTras = performance.now() - a;
  const tfin = performance.now();
  const iv = intervalos(t0, tfin);
  r.sondeo = { lanzar: +tl.toFixed(1), frames, ms: +(tfin - t0).toFixed(1), maxConsulta: +maxConsulta.toFixed(2), linkStatusTras: +linkTras.toFixed(2), ok: okB,
               intervaloMax: +Math.max(...iv).toFixed(1), framesLentos: iv.filter((x) => x > 20).length };
  gl.deleteProgram(pa); gl.deleteProgram(pb);
  return r;
};
</script></body></html>
