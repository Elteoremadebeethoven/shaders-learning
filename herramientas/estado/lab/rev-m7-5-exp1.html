<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<canvas id="c" width="64" height="64"></canvas>
<script>
const R = {};
function log(k, v) { R[k] = v; }
function err(gl) { const e = gl.getError(); return e === 0 ? "NO_ERROR" : "0x" + e.toString(16); }
function sh(gl, tipo, src) { const s = gl.createShader(tipo); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(gl, vs, fs, tf, modo) {
  const p = gl.createProgram();
  const v = sh(gl, gl.VERTEX_SHADER, vs), f = sh(gl, gl.FRAGMENT_SHADER, fs);
  gl.attachShader(p, v); gl.attachShader(p, f);
  if (tf) gl.transformFeedbackVaryings(p, tf, modo || gl.INTERLEAVED_ATTRIBS);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  R["log_" + Object.keys(R).length] = gl.getShaderInfoLog(v) || "";
  return p;
}
const CAB = "#version 300 es\nprecision highp float;\nprecision highp int;\n";
const VS_PANT = CAB + "void main(){ vec2 P[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.)); gl_Position=vec4(P[gl_VertexID],0.,1.); gl_PointSize=1.0; }";
function texF(gl, w, h, ifmt, fmt, tipo, datos, filtro) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, tipo, datos || null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filtro); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filtro);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fboDe(gl, t) { const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return f; }

try {
  // ---------- contexto 1: SIN pedir extensiones ----------
  const c1 = document.createElement("canvas"); c1.width = c1.height = 8;
  const g1 = c1.getContext("webgl2");
  log("soportadas", g1.getSupportedExtensions().filter(e => /float|half|blend/i.test(e)));
  log("renderer", g1.getParameter(g1.RENDERER));
  log("MAX_TF_INTERLEAVED", g1.getParameter(g1.MAX_TRANSFORM_FEEDBACK_INTERLEAVED_COMPONENTS));
  log("MAX_TF_SEP_ATTRIBS", g1.getParameter(g1.MAX_TRANSFORM_FEEDBACK_SEPARATE_ATTRIBS));
  log("POINT_RANGE", Array.from(g1.getParameter(g1.ALIASED_POINT_SIZE_RANGE)));
  for (const [n, ifmt, tipo] of [["RGBA32F", g1.RGBA32F, g1.FLOAT], ["RGBA16F", g1.RGBA16F, g1.HALF_FLOAT]]) {
    const t = texF(g1, 4, 4, ifmt, g1.RGBA, tipo, null, g1.NEAREST); fboDe(g1, t);
    log("sinExt_fbo_" + n, "0x" + g1.checkFramebufferStatus(g1.FRAMEBUFFER).toString(16));
  }
  // RGBA16F filtrable sin extensiones: textura 2x1 (0 y 1) LINEAR, muestrear en el centro → 0,5
  {
    const gl = g1;
    const datos = new Float32Array([0,0,0,1, 1,1,1,1]);
    const t = texF(gl, 2, 1, gl.RGBA16F, gl.RGBA, gl.FLOAT, datos, gl.LINEAR);
    const tRes = texF(gl, 1, 1, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, null, gl.NEAREST); const f = fboDe(gl, tRes);
    const p = prog(gl, VS_PANT, CAB + "uniform sampler2D u; out vec4 o; void main(){ o = texture(u, vec2(0.5, 0.5)); }");
    gl.viewport(0, 0, 1, 1); gl.useProgram(p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    log("RGBA16F_linear_sinExt", Array.from(px));
  }

  // ---------- contexto 2: con EXT_color_buffer_float ----------
  const c2 = document.getElementById("c");
  const gl = c2.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true });
  log("EXT_color_buffer_float", !!gl.getExtension("EXT_color_buffer_float"));
  for (const [n, ifmt, fmt, tipo] of [["RGBA32F", gl.RGBA32F, gl.RGBA, gl.FLOAT], ["RG32F", gl.RG32F, gl.RG, gl.FLOAT], ["RGB32F", gl.RGB32F, gl.RGB, gl.FLOAT], ["RGBA16F", gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT]]) {
    const t = texF(gl, 4, 4, ifmt, fmt, tipo, null, gl.NEAREST); fboDe(gl, t);
    log("conExt_fbo_" + n, "0x" + gl.checkFramebufferStatus(gl.FRAMEBUFFER).toString(16));
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // E3: RGBA32F con LINEAR sin OES_texture_float_linear → texelFetch en VS y FS
  {
    const datos = new Float32Array([0.25, 0.5, 0.75, 1.0]);
    const salida = texF(gl, 1, 1, gl.RGBA32F, gl.RGBA, gl.FLOAT, null, gl.NEAREST); const f = fboDe(gl, salida);
    const pFS = prog(gl, VS_PANT, CAB + "uniform highp sampler2D u; out vec4 o; void main(){ o = texelFetch(u, ivec2(0), 0) + vec4(0.0,0.0,0.0,0.0); }");
    const pVS = prog(gl, CAB + "uniform highp sampler2D u; out vec4 v; void main(){ vec2 P[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.)); v = texelFetch(u, ivec2(0), 0); gl_Position=vec4(P[gl_VertexID],0.,1.); }",
                     CAB + "in vec4 v; out vec4 o; void main(){ o = v; }");
    for (const [nombre, filtro] of [["LINEAR", gl.LINEAR], ["NEAREST", gl.NEAREST], ["NEAREST_MIPMAP_LINEAR", gl.NEAREST_MIPMAP_LINEAR]]) {
      const t = texF(gl, 1, 1, gl.RGBA32F, gl.RGBA, gl.FLOAT, datos, filtro);
      if (nombre === "NEAREST_MIPMAP_LINEAR") gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      for (const [donde, p] of [["FS", pFS], ["VS", pVS]]) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.viewport(0, 0, 1, 1);
        gl.clearColor(9, 9, 9, 9); gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, t);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        const px = new Float32Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px);
        log("texelFetch_" + nombre + "_" + donde, Array.from(px));
      }
    }
    // E4: bucle de realimentación con textura completa y con incompleta
    for (const [nombre, filtro] of [["NEAREST", gl.NEAREST], ["LINEAR", gl.LINEAR]]) {
      const t = texF(gl, 1, 1, gl.RGBA32F, gl.RGBA, gl.FLOAT, datos, filtro);
      const fb = fboDe(gl, t); gl.viewport(0, 0, 1, 1);
      gl.useProgram(pFS); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.getError(); gl.drawArrays(gl.TRIANGLES, 0, 3);
      log("feedback_" + nombre, err(gl));
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // E5: mezcla en RGBA32F sin pedir EXT_float_blend
  {
    const t = texF(gl, 1, 1, gl.RGBA32F, gl.RGBA, gl.FLOAT, null, gl.NEAREST); const f = fboDe(gl, t);
    const p = prog(gl, VS_PANT, CAB + "uniform float u_v; out vec4 o; void main(){ o = vec4(u_v); }");
    gl.viewport(0, 0, 1, 1); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(p); gl.uniform1f(gl.getUniformLocation(p, "u_v"), 0.001);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.getError();
    for (let i = 0; i < 1000; i++) gl.drawArrays(gl.TRIANGLES, 0, 3);
    log("blend32F_sinFloatBlend_error", err(gl));
    const px = new Float32Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px);
    log("blend32F_1000x0.001", px[0]);
    const fb = gl.getExtension("EXT_float_blend");
    log("EXT_float_blend_disponible", !!fb);
    // RGBA16F: 1000 × 0.001 y 5000 × 0.001
    const t16 = texF(gl, 1, 1, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, null, gl.NEAREST); fboDe(gl, t16);
    gl.clear(gl.COLOR_BUFFER_BIT);
    for (let i = 0; i < 1000; i++) gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px); log("blend16F_1000x0.001", px[0]);
    gl.clear(gl.COLOR_BUFFER_BIT);
    for (let i = 0; i < 5000; i++) gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px); log("blend16F_5000x0.001", px[0]);
    // RGBA8: 0.0019 × 100 y 0.002 × 100
    const t8 = texF(gl, 1, 1, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, null, gl.NEAREST); fboDe(gl, t8);
    for (const v of [0.0019, 0.002, 0.005, 0.0015]) {
      gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(gl.getUniformLocation(p, "u_v"), v);
      for (let i = 0; i < 100; i++) gl.drawArrays(gl.TRIANGLES, 0, 3);
      const b = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b); log("blend8_100x" + v, b[0]);
    }
    gl.disable(gl.BLEND);
    // E17: half float al escribir: ¿redondea o trunca? x = 0.5 + 0.000333 (sub-ULP pero > medio ULP)
    gl.uniform1f(gl.getUniformLocation(p, "u_v"), 0.5 + 0.02 / 60);
    fboDe(gl, t16); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px); log("half_0.500333", px[0]);
    gl.uniform1f(gl.getUniformLocation(p, "u_v"), 1.0 + 0.0009);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px); log("half_1.0009", px[0]);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // E6: RASTERIZER_DISCARD y clear
  {
    gl.viewport(0, 0, 64, 64);
    gl.clearColor(0, 0, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.RASTERIZER_DISCARD);
    gl.clearColor(1, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    const b = new Uint8Array(4); gl.readPixels(5, 5, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
    log("discard_clear", Array.from(b));
    gl.disable(gl.RASTERIZER_DISCARD);
  }

  // TF: programa de simulación (duplica) y buffers
  {
    const VS = CAB + "layout(location=0) in vec2 a_pos; layout(location=1) in vec2 a_vel; out vec2 v_pos; out vec2 v_vel; void main(){ v_pos = a_pos + a_vel; v_vel = a_vel; }";
    const FS = CAB + "out vec4 o; void main(){ o = vec4(0.0); }";
    const p = prog(gl, VS, FS, ["v_pos", "v_vel"], gl.INTERLEAVED_ATTRIBS);
    log("VS_sin_glPosition_log", gl.getShaderInfoLog ? "(ver log_*)" : "");
    const info = gl.getTransformFeedbackVarying(p, 0);
    log("tfVarying0", [info.name, "0x" + info.type.toString(16), info.size]);
    const ini = new Float32Array([0.5, 0, 1, 0,  1, 1, 2, 0,  2, 2, 3, 0,  3, 3, 4, 0]);   // 4 partículas
    const A = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, A); gl.bufferData(gl.ARRAY_BUFFER, ini, gl.DYNAMIC_COPY);
    const B = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, B); gl.bufferData(gl.ARRAY_BUFFER, ini.byteLength, gl.DYNAMIC_COPY);
    const peq = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, peq); gl.bufferData(gl.ARRAY_BUFFER, 16, gl.DYNAMIC_COPY);
    function vaoPara(buf, div) {
      const v = gl.createVertexArray(); gl.bindVertexArray(v); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0); gl.vertexAttribDivisor(0, div);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8); gl.vertexAttribDivisor(1, div);
      gl.bindVertexArray(null); return v;
    }
    const vA = vaoPara(A, 0), vA1 = vaoPara(A, 1);
    const tf = gl.createTransformFeedback();
    function paso(vao, salida, opciones) {
      const o = opciones || {};
      gl.useProgram(p); gl.bindVertexArray(vao);
      gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
      gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, salida);
      if (o.arrayBuffer) gl.bindBuffer(gl.ARRAY_BUFFER, o.arrayBuffer);
      if (o.uniformBuffer) gl.bindBuffer(gl.UNIFORM_BUFFER, o.uniformBuffer);
      gl.enable(gl.RASTERIZER_DISCARD);
      gl.getError();
      gl.beginTransformFeedback(o.modo || gl.POINTS);
      const eBegin = err(gl);
      if (o.useProgram) { gl.useProgram(p); o.res.useProgram = err(gl); }
      gl.drawArrays(gl.POINTS, 0, 4);
      const eDraw = err(gl);
      gl.endTransformFeedback(); err(gl);
      gl.disable(gl.RASTERIZER_DISCARD);
      gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null);
      gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
      gl.bindBuffer(gl.ARRAY_BUFFER, null); gl.bindBuffer(gl.UNIFORM_BUFFER, null);
      gl.bindVertexArray(null);
      return { eBegin, eDraw };
    }
    function leer(buf) { const d = new Float32Array(16); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.getBufferSubData(gl.ARRAY_BUFFER, 0, d); gl.bindBuffer(gl.ARRAY_BUFFER, null); return Array.from(d); }
    gl.bindBuffer(gl.ARRAY_BUFFER, null);
    log("tf_ok", [paso(vA, B), leer(B)]);
    log("tf_divisor1", [paso(vA1, B), leer(B)]);
    log("tf_salida_en_ARRAY_BUFFER", paso(vA, B, { arrayBuffer: B }));
    log("tf_entrada_en_ARRAY_BUFFER", paso(vA, B, { arrayBuffer: A }));
    const ub = B; log("tf_salida_en_UNIFORM_BUFFER", paso(vA, B, { uniformBuffer: ub }));
    const res = {}; paso(vA, B, { useProgram: true, res }); log("tf_useProgram_activo", res.useProgram);
    log("tf_modo_TRIANGLES", paso(vA, B, { modo: gl.TRIANGLES }));
    log("tf_buffer_pequeño", paso(vA, peq));
    // separate attribs con un solo buffer
    const pSep = prog(gl, VS, FS, ["v_pos", "v_vel"], gl.SEPARATE_ATTRIBS);
    gl.useProgram(pSep); gl.bindVertexArray(vA); gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, B); gl.enable(gl.RASTERIZER_DISCARD); gl.getError();
    gl.beginTransformFeedback(gl.POINTS); log("tf_separate_un_buffer_begin", err(gl));
    gl.disable(gl.RASTERIZER_DISCARD); gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null); gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null); gl.bindVertexArray(null);
    // dibujar con B como atributo mientras sigue en el punto 0 del TF enlazado
    {
      const pd = prog(gl, CAB + "layout(location=0) in vec2 a_pos; void main(){ gl_Position = vec4(a_pos*0.0, 0.0, 1.0); gl_PointSize = 1.0; }", FS);
      const vB = vaoPara(B, 0);
      gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf); gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, B);
      gl.useProgram(pd); gl.bindVertexArray(vB); gl.getError(); gl.drawArrays(gl.POINTS, 0, 4);
      log("dibujar_con_buffer_en_TF_enlazado", err(gl));
      gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
      gl.drawArrays(gl.POINTS, 0, 4); log("dibujar_tras_desenlazar_TF_obj", err(gl));
      gl.bindVertexArray(null);
    }
  }

  // E12: FLIP_Y con Float32Array
  {
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    const t = texF(gl, 1, 2, gl.RGBA32F, gl.RGBA, gl.FLOAT, new Float32Array([0.25,0,0,1, 0.75,0,0,1]), gl.NEAREST);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    const f = fboDe(gl, t); const px = new Float32Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px);
    log("flipY_float_texel00", px[0]);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // E13: punto de 32 px con el centro fuera del lienzo
  {
    gl.viewport(0, 0, 64, 64); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    const p = prog(gl, CAB + "void main(){ gl_Position = vec4(1.1, 0.0, 0.0, 1.0); gl_PointSize = 32.0; }", CAB + "out vec4 o; void main(){ o = vec4(1.0); }");
    gl.useProgram(p); gl.drawArrays(gl.POINTS, 0, 1);
    const b = new Uint8Array(4); gl.readPixels(60, 32, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
    log("punto_centro_fuera_pixel_(60,32)", Array.from(b));
  }
} catch (e) { R.excepcion = String(e && e.stack || e); }
window.__R = R;
</script>
</body></html>
