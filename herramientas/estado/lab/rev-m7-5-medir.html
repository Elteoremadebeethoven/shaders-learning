<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lab 7.5 · tiempos de GPU de las partículas</title>
<!--
  Laboratorio de la revisión de 7.5 (rev-m7-5, sesión 3). Mide con el MÉTODO FIABLE de PLAN_CONTINUACION.md §4 /
  GUIA_AUTORES §5.6 las cifras de 7.5 que no se pudieron re-medir sin el M1:
    - frame completo (simular + limpiar + dibujar) con texturas y con transform feedback, 1 M y 4 M (tabla «Comparativa»);
    - simulación sola y dibujo solo de 1 M (lista «Con un millón de partículas, lo caro ya no es simular…»);
    - dibujo directo al canvas frente a acumular en RGBA16F + pasada de tono (solución del ejercicio 7.5.4: «5,5 ms frente a 8,4»).
  Método: cada iteración es una pasada propia (el dibujo alterna entre dos FBO, o entre el FBO de simulación y el canvas),
  con clear al empezar; readPixels de 1 píxel al final; mediana de 5 tandas de 20.
  Uso en el M1: abrir este archivo con file:// en Chrome (ventana normal; también vale headless con GPU) y pulsar «medir».
  Con puppeteer: await page.evaluate(() => medirTodo()) devuelve el mismo objeto que se muestra.
  Canvas de 1000 × 600 píxeles de búfer, sin antialiasing, como en la lección. Con ?rapido mide 16 K y 65 K (prueba de humo).
-->
<style>body{font:14px system-ui;background:#111;color:#ddd;margin:16px} canvas{width:500px;height:300px;display:block;margin:8px 0;background:#000} pre{white-space:pre-wrap}</style>
</head>
<body>
<button id="b">medir</button>
<canvas id="c" width="1000" height="600"></canvas>
<pre id="out"></pre>
<script src="../../../assets/js/glkit.js"></script>
<script src="../../../modulos/07-integracion/recursos/l75-particulas.js"></script>
<script>
"use strict";
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, powerPreference: "high-performance" });
const W = 1000, H = 600, ASPECTO = W / H;
const NS = location.search.includes("rapido") ? [16384, 65536] : [1048576, 4194304];   // ?rapido: prueba de humo
gl.getExtension("EXT_color_buffer_float");
const px = new Uint8Array(4);
function esperarGPU() { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
function mediana(a) { const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; }
function medir(iteracion, K = 20, tandas = 5) {
  iteracion(0); esperarGPU();                      // calentar y vaciar lo pendiente
  const t = [];
  for (let j = 0; j < tandas; j++) {
    const t0 = performance.now();
    for (let k = 1; k <= K; k++) iteracion(j * K + k);
    esperarGPU();
    t.push((performance.now() - t0) / K);
  }
  return +mediana(t).toFixed(2);
}
const CAB = "#version 300 es\nprecision highp float;\nprecision highp int;\n";
const VS_PANT = CAB + "void main(){ vec2 P[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.)); gl_Position=vec4(P[gl_VertexID],0.,1.); }";
const FS_TONO = CAB + "uniform highp sampler2D u_hdr; out vec4 o; void main(){ vec3 a = texelFetch(u_hdr, ivec2(gl_FragCoord.xy), 0).rgb; o = vec4(1.0 - exp(-a * 40.0), 1.0); }";
const tono = GLKit.crearPrograma(gl, VS_PANT, FS_TONO), uTono = GLKit.uniforms(gl, tono);
const vaoVacio = gl.createVertexArray();
const opc8 = { filtro: gl.NEAREST, formatoInterno: gl.RGBA8, formato: gl.RGBA, tipo: gl.UNSIGNED_BYTE };
const opc16 = { filtro: gl.NEAREST, formatoInterno: gl.RGBA16F, formato: gl.RGBA, tipo: gl.HALF_FLOAT };
const fbo8 = [GLKit.crearFBO(gl, W, H, opc8), GLKit.crearFBO(gl, W, H, opc8)];
const fbo16 = [GLKit.crearFBO(gl, W, H, opc16), GLKit.crearFBO(gl, W, H, opc16)];

function prepararDibujo(destino) {                 // destino: null (canvas) o un FBO
  gl.bindFramebuffer(gl.FRAMEBUFFER, destino ? destino.fbo : null);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0.03, 0.035, 0.05, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
}
function terminarDibujo() { gl.disable(gl.BLEND); }

function medirMetodo(metodo, n) {
  const m = L75.crearMotor(gl, metodo);
  m.iniciar(n, ASPECTO);
  const u = { aspecto: ASPECTO, tamPunto: 1.5, brillo: Math.min(1, 60 / Math.sqrt(n)) };
  const paso = (k) => m.paso({ dt: 1 / 60, t: k / 60, aspecto: ASPECTO, raton: [0, 0, 0] });
  const r = {};
  // 1) frame completo, como la tabla de la lección y el botón «medir GPU»: simular + limpiar el canvas + dibujar
  r.frameCanvas = medir((k) => { paso(k); prepararDibujo(null); m.dibujar(u); terminarDibujo(); });
  // 2) solo simular (la salida de cada paso es la entrada del siguiente: nada que ahorrarse)
  r.soloSimular = medir((k) => paso(k));
  // 3) solo dibujar, cada dibujo en su propia pasada (dos FBO RGBA8 alternos con clear)
  r.soloDibujarFBO8 = medir((k) => { prepararDibujo(fbo8[k & 1]); m.dibujar(u); terminarDibujo(); });
  // 4) solo dibujar en el canvas, repetido (el método que el §4 desaconseja; con mezcla aditiva debería coincidir con 3)
  r.soloDibujarCanvas = medir(() => { prepararDibujo(null); m.dibujar(u); terminarDibujo(); });
  if (n === NS[0]) {
    // 5) ejercicio 7.5.4: acumular en RGBA16F (dos FBO alternos) + pasada de tono al canvas, con brillo 0,0015
    const u2 = { aspecto: ASPECTO, tamPunto: 1.5, brillo: 0.0015 };
    r.acumular16F_mas_tono = medir((k) => {
      const f = fbo16[k & 1];
      prepararDibujo(f); m.dibujar(u2); terminarDibujo();
      gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
      gl.useProgram(tono); gl.bindVertexArray(vaoVacio);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, f.textura);
      GLKit.ponerUniform(gl, uTono.u_hdr, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindVertexArray(null);
    });
    r.directoCanvas_brillo0_0015 = medir(() => { prepararDibujo(null); m.dibujar(u2); terminarDibujo(); });
    r.solo16F = medir((k) => { prepararDibujo(fbo16[k & 1]); m.dibujar(u2); terminarDibujo(); });
  }
  m.liberar();
  return r;
}
function medirTodo() {
  const R = { renderer: gl.getParameter(gl.RENDERER), buffer: [gl.drawingBufferWidth, gl.drawingBufferHeight] };
  for (const n of NS) for (const metodo of ["texturas", "tf"]) {
    R[metodo + "_" + n] = medirMetodo(metodo, n);
    document.getElementById("out").textContent = JSON.stringify(R, null, 2);
  }
  window.__R = R;
  return R;
}
window.medirTodo = medirTodo;
document.getElementById("b").onclick = () => { document.getElementById("out").textContent = "midiendo… (unos segundos)"; setTimeout(medirTodo, 50); };
</script>
</body>
</html>
