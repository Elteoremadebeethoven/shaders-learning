<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id="c" width="8" height="8"></canvas>
<script>
const gl = document.getElementById('c').getContext('webgl2');
const VS = `#version 300 es
void main(){ gl_Position = vec4(0.0,0.0,0.0,1.0); gl_PointSize = 1.0; }`;
const FS = `#version 300 es
precision highp float;
uniform vec3 u_ondas[8];
out vec4 o;
void main(){ vec3 s = vec3(0.0); for (int i = 0; i < 8; i++) s += u_ondas[i]; o = vec4(s, 1.0); }`;
function sh(t, s){ const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if(!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; }
const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(p);
gl.useProgram(p);
const res = {};
const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); res['activo' + i] = [a.name, a.type === gl.FLOAT_VEC3 ? 'FLOAT_VEC3' : a.type, a.size]; }
const l = gl.getUniformLocation(p, 'u_ondas'), l0 = gl.getUniformLocation(p, 'u_ondas[0]'), l5 = gl.getUniformLocation(p, 'u_ondas[5]');
res.igualesObj = l === l0; res.l5 = !!l5;
gl.uniform3fv(l0, [7, 8, 9]); res.leidoConL = Array.from(gl.getUniform(p, l)); 
const leer = () => { const out = []; for (let i = 0; i < 8; i++) out.push(Array.from(gl.getUniform(p, gl.getUniformLocation(p, 'u_ondas[' + i + ']')))[0]); return out; };
gl.uniform3fv(l, new Float32Array(24).map((_, i) => 1)); res.con24 = leer();
gl.uniform3fv(l, new Float32Array(12).map(() => 2)); res.con12 = leer(); res.err12 = gl.getError();
gl.uniform3fv(l, new Float32Array(30).map(() => 3)); res.con30 = leer(); res.err30 = gl.getError();
gl.uniform3fv(l, new Float32Array(10).map(() => 4)); res.err10 = gl.getError(); res.con10 = leer();
gl.uniform3fv(l5, new Float32Array(24).map(() => 5)); res.desde5con24 = leer(); res.errDesde5 = gl.getError();
res.maxFrag = gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS);
res.INVALID_VALUE = gl.INVALID_VALUE;
window.res = res;
</script></body></html>
